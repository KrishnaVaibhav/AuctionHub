name: backup
on:
  schedule:
    - cron: "40 2 * * *" # daily 02:40 UTC
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      PROJECT_REF: yuqccqmzxmpxfedmkgwp
    steps:
      # Artifacts of a public repo are downloadable by any GitHub user, so
      # never upload an unencrypted dump.
      - name: Require encryption passphrase
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add a BACKUP_PASSPHRASE repository secret to enable encrypted backups."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Dump schema, roles and data
        run: |
          mkdir -p backup
          supabase db dump --remote --role-only -f backup/roles.sql
          supabase db dump --remote -f backup/schema.sql
          supabase db dump --remote --data-only --use-copy -f backup/data.sql
          ls -la backup
      - name: Encrypt
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          tar -czf - backup | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o "auctionhub-$STAMP.tar.gz.gpg"
          rm -rf backup
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: auctionhub-db-${{ env.STAMP }}
          path: auctionhub-*.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
