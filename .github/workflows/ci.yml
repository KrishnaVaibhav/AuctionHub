name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main midway: it may be deploying migrations.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor
      - run: supabase test db
      - run: supabase db lint --level error

  # Apply new migrations to the production Supabase project, only after tests pass on main.
  deploy-db:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, database]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-db
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: yuqccqmzxmpxfedmkgwp
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Pending migrations
        run: supabase db push --remote --dry-run
      - name: Apply migrations
        run: supabase db push --remote --yes
