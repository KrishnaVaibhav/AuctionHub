name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main midway: it may be deploying migrations.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The npm cache is restored above, so install from it without asking the registry.
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/supabase-cli
      # pgTAP and the linter only talk to Postgres (auth and storage stay: their
      # schemas are used by the migrations). The API gateway, REST and realtime
      # servers aren't needed here, so they aren't pulled or started.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor,realtime,postgrest,kong
      - run: supabase test db
      - run: supabase db lint --level error

  # Browser tests (Playwright) against a local Supabase stack + Vite dev server.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/supabase-cli
      # The stack takes the longest to come up: start it in the background and
      # install Node packages and the browser meanwhile.
      - name: Start Supabase (background)
        working-directory: .
        run: |
          (supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor \
            > "$RUNNER_TEMP/supabase-start.log" 2>&1; echo $? > "$RUNNER_TEMP/supabase-start.exit") &
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Browsers are cached per Playwright version; the system libraries they
      # need are installed either way (apt is fast, and they live outside the cache).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Wait for Supabase
        working-directory: .
        run: |
          for _ in $(seq 1 300); do
            [ -f "$RUNNER_TEMP/supabase-start.exit" ] && break
            sleep 1
          done
          cat "$RUNNER_TEMP/supabase-start.log"
          if [ "$(cat "$RUNNER_TEMP/supabase-start.exit" 2>/dev/null)" != "0" ]; then
            echo "::error::supabase start failed or timed out"
            exit 1
          fi
      - name: Local Supabase env
        working-directory: .
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  # Apply new migrations to the production Supabase project, only after tests pass on main.
  deploy-db:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, database, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-db
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: yuqccqmzxmpxfedmkgwp
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/supabase-cli
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Pending migrations
        run: supabase db push --remote --dry-run
      - name: Apply migrations
        run: supabase db push --remote --yes
