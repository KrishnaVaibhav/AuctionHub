<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app has its own dark theme: ask Dark Reader not to repaint it. -->
    <meta name="darkreader-lock" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Host and join live auctions with real-time bidding and chat." />
    <meta name="theme-color" content="#fafaf9" />
    <meta property="og:site_name" content="AuctionHub" />
    <meta property="og:title" content="AuctionHub · Live auctions" />
    <meta property="og:description" content="Host and join live auctions with real-time bidding, chat and team leagues." />
    <meta name="twitter:card" content="summary" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          if (dark) {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f0e0d");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AuctionHub</title>
  </head>
  <body class="text-stone-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
